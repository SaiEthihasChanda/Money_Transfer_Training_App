<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container">

<div class="display-1">Money Transfer System</div>
<hr/>

<a class="btn btn-primary" href="/new-account">Create Account</a>
<a class="btn btn-success ms-2" href="/transfer">Transfer Money</a>

<hr/>
<h5 class="mt-3">Check Reward Points</h5>
<form action="#" method="get" id="rewardForm" onsubmit="goToRewards(event)">
    <div class="d-flex gap-2" style="max-width: 320px;">
        <input type="number" class="form-control" id="rewardAccountId"
               placeholder="Enter Account ID" min="1" required/>
        <button type="submit" class="btn btn-warning">View Rewards</button>
    </div>
</form>

<script>
    function goToRewards(e) {
        e.preventDefault();
        const id = document.getElementById('rewardAccountId').value;
        if (id) window.location.href = '/rewards/' + id;
    }
</script>

</body>
</html>
