<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reward Points</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container">

<div class="display-1">Reward Points</div>
<hr/>

<a class="btn btn-secondary mb-3" href="/">Back</a>

<!-- Summary card -->
<div class="card mb-4" style="max-width: 340px;">
    <div class="card-body">
        <h5 class="card-title">Account #<span th:text="${accountId}"></span></h5>
        <p class="card-text fs-4">
            Total Points:
            <span class="badge bg-success fs-5" th:text="${totalPoints}">0</span>
        </p>
    </div>
</div>

<!-- Reward history table -->
<h4>Reward History</h4>

<div th:if="${#lists.isEmpty(rewardHistory)}">
    <p class="text-muted">No rewards earned yet. Transfer more than ₹100 to start earning!</p>
</div>

<table th:if="${!#lists.isEmpty(rewardHistory)}"
       class="table table-striped table-hover" style="max-width: 800px;">
    <thead class="table-dark">
    <tr>
        <th>#</th>
        <th>Transaction ID</th>
        <th>Points Awarded</th>
        <th>Description</th>
        <th>Date &amp; Time</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry, stat : ${rewardHistory}">
        <td th:text="${stat.count}"></td>
        <td th:text="${entry.transactionId}"></td>
        <td><span class="badge bg-primary" th:text="${entry.pointsAwarded}"></span></td>
        <td th:text="${entry.description}"></td>
        <td th:text="${#temporals.format(entry.createdAt, 'dd-MM-yyyy HH:mm:ss')}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
